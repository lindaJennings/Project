name: Install Testkube to EKS cluster

on:
  workflow_dispatch:

jobs:
  setup-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

    - name: Install Testkube CLI
      run: |
        curl -L https://github.com/kubeshop/testkube/releases/download/v1.15.3/kubectl-testkube-v1.15.3-linux-amd64 \
        -o /usr/local/bin/kubectl-testkube
        chmod +x /usr/local/bin/kubectl-testkube

    - name: Install Testkube in cluster
      run: |
        testkube init --namespace testkube
